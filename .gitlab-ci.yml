stages:
  - deploy

variables:
  projectName: Prepara.me - ADMIN
  shouldRunCompose: "false"
  projetctFolderHomolog: admin/admin.preparame.n1.homolog.inf.br
  projectPm2NameHomolog: admin.preparame.n1.homolog.inf.br
  projetctFolderProduction: preparame_app
  projectPm2NameProduction: plataforma

deploy_homolog:
  stage: deploy
  script:
    - echo "Deploying develop branch..."
    - echo "Acessando pasta do projeto..."
    - cd /var/www/$projetctFolderHomolog
    - git checkout .
    - git pull origin develop
    - echo "Dando permissão para a pasta do projeto..."
    - sudo chmod -R 777 /var/www/$projetctFolderHomolog
    - echo "Gerando build..."
    - sudo npx quasar build
    - echo "Publicando $projectName"
    - sudo pm2 restart $projectPm2NameHomolog
    - echo "Finalizando deploy..."
  tags:
    - homolog_sso
  only:
    - develop # Run on branches starting with ''

deploy_production:
  stage: deploy
  script:
    - echo "Deploying master branch..."
    - echo "Acessando pasta do projeto..."
    - cd /var/www/$projetctFolderProduction
    - git checkout .
    - git pull origin main
    - echo "Dando permissão para a pasta do projeto..."
    - sudo chmod -R 777 /var/www/$projetctFolderProduction
    - echo "Gerando build..."
    - sudo npx quasar build
    - echo "Publicando $projectName"
    - sudo pm2 restart $projectPm2NameProduction
    - echo "Finalizando deploy..."
  tags:
    - preparame_prod
  only:
    - main # Run on branches starting with ''
